<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cebu Eastern College - Student Portal</title>
   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
     
        :root {
            --primary-blue: #2a4b9b;
            --primary-blue-dark: #1e3a7a;
            --nav-blue: #3a5aa8;
            --nav-gold: #f2b705;
            --text-dark: #333;
            --text-light: #666;
            --bg-light: #f8f9fa;
            --border-color: #e0e0e0;
            --accent-red: #e74c3c;
            --accent-green: #2ecc71;
            --accent-orange: #f39c12;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

 
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary-blue);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-blue-dark);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-dark);
        }

        .btn-outline:hover {
            background-color: #f0f0f0;
        }

   
        header {
            background-color: var(--primary-blue);
            color: white;
            padding: 15px 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-placeholder {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary-blue);
            font-size: 24px;
            background-image: url('./img/cecLOGO.png'); 
            background-size: contain;
            background-repeat: no-repeat;
        }
        

        .logo-text h1 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo-text p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        
        .navigation {
            display: flex;
            justify-content: space-between;
            background-color: var(--nav-blue);
            color: white;
        }

        .nav-item {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 12px;
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.2;
            text-align: center;
            border-bottom: 4px solid transparent;
            transition: background-color 0.3s;
        }

        .nav-item:hover {
            background-color: rgba(255, 255, 255, 0.12);
        }

        .nav-item.active {
            background-color: white;
            color: var(--primary-blue-dark);
            border-bottom-color: var(--nav-gold);
        }

        .nav-icon {
            font-size: 1.15rem;
            line-height: 1;
            flex: none;
        }

        .nav-item:focus-visible {
            outline: 2px solid var(--nav-gold);
            outline-offset: -4px;
        }

   
        .hero {
            padding: 60px 0;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
        }

  
        .hero::before {
            content: '';
            position: absolute;
            top: 10%;
            left: -5%;
            width: 60%;
            height: 80%;
            background: #e0f2fe;
            border-radius: 20px;
            transform: skewX(-15deg);
            z-index: 0;
            opacity: 0.5;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            gap: 40px;
            position: relative;
            z-index: 1;
        }

        @media (min-width: 992px) {
            .hero-content {
                flex-direction: row;
                align-items: center;
            }
            .hero-left {
                flex: 1;
            }
            .hero-right {
                flex: 1.2;
            }
        }

        .hero-left h2 {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        .hero-left h1 {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary-blue);
            line-height: 1.1;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hero-left p {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 30px;
            max-width: 400px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
