<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Cebu Eastern College</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Reset & Variables */
        :root {
            --primary-blue: #253b80; /* Header blue */
            --btn-blue: #2a3eb1;     /* Button blue */
            --text-dark: #333;
            --text-light: #666;
            --border-color: #ccc;
            --input-bg: #e2e5ea;     /* Light gray for inputs */
            --link-blue: #3b59d4;    /* Blue for text links */
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
        }

        /* Header */
        header {
            background-color: var(--primary-blue);
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-placeholder {
            width: 45px;
            height: 45px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary-blue);
            font-size: 22px;
        }

        .logo-text h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .logo-text p {
            font-size: 0.8rem;
            font-weight: 400;
            opacity: 0.9;
        }

        /* Navigation */
        nav ul {
            display: flex;
            align-items: center;
            gap: 30px;
            list-style: none;
        }

        nav a {
            color: white;
            font-size: 0.9rem;
            font-weight: 500;
            transition: opacity 0.3s;
        }

        nav a:hover {
            opacity: 0.8;
        }

        .btn-header-login {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 18px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background-color 0.3s;
        }

        .btn-header-login:hover {
            background-color: rgba(255, 255, 255, 0.3);
            opacity: 1;
        }

        /* Main Background Area */
        .signup-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            /* Simulating the faded building background */
            background: linear-gradient(rgba(210, 225, 240, 0.7), rgba(210, 225, 240, 0.7)), 
                        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect fill="%23b8cce0" width="100" height="100"/><path d="M0 50h100M50 0v100" stroke="%23a0b8d0" stroke-width="1"/></svg>');
            background-size: cover;
            background-position: center;
        }

        /* Sign Up Card */
        .signup-card {
            background-color: white;
            width: 100%;
            max-width: 450px;
            padding: 40px 35px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .signup-card h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 5px;
            color: #000;
        }

        .signup-card p.subtitle {
            font-size: 0.9rem;
            color: var(--text-dark);
            margin-bottom: 25px;
        }

        /* Form Elements */
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 0 15px;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            background-color: white;
            border-color: var(--btn-blue);
            box-shadow: 0 0 0 1px var(--btn-blue);
        }

        .input-wrapper i {
            color: #555;
            font-size: 1rem;
            margin-right: 12px;
        }

        .input-wrapper input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            padding: 12px 0;
            font-size: 0.9rem;
            color: var(--text-dark);
            font-family: inherit;
        }

        .input-wrapper input::placeholder {
            color: #888;
        }

        /* Checkbox Group */
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-top: 15px;
            margin-bottom: 20px;
            text-align: left;
        }

        .checkbox-group input[type="checkbox"] {
            margin-top: 3px;
            cursor: pointer;
            width: 14px;
            height: 14px;
        }

        .checkbox-group label {
            font-size: 0.75rem;
            color: var(--text-dark);
            font-weight: 400;
            cursor: pointer;
            line-height: 1.4;
        }

        .checkbox-group a {
            color: var(--link-blue);
            font-weight: 600;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        /* Buttons */
        .btn-signup {
            width: 100%;
            background-color: var(--btn-blue);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 20px;
        }

        .btn-signup:hover {
            background-color: #1e2e8a;
        }

        /* Bottom Link */
        .login-link {
            font-size: 0.8rem;
            color: var(--text-dark);
        }

        .login-link a {
            color: var(--link-blue);
            font-weight: 700;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }
            nav ul {
                gap: 20px;
            }
        }

        @media (max-width: 480px) {
            .signup-card {
                padding: 30px 20px;
            }
            .signup-card h2 {
                font-size: 1.8rem;
            }
            .logo-text h1 {
                font-size: 1rem;
            }
            nav ul {
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-area">
            <div class="logo-placeholder">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <div class="logo-text">
                <h1>CEBU EASTERN COLLEGE</h1>
                <p>Student Portal</p>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="./login.html" class="btn-header-login">Login</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="signup-wrapper">
        <div class="signup-card">
            <h2>Sign Up</h2>
            <p class="subtitle">Create your account</p>

            <form action="#" method="POST">
                
                <!-- Full Name Field -->
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="fullname" placeholder="Enter your name" required>
                    </div>
                </div>

                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <!-- ID Field -->
                <div class="form-group">
                    <label for="id">ID</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-id-badge"></i>
                        <input type="number" id="id" placeholder="Enter your ID" required>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <!-- Terms & Conditions Checkbox -->
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        I agree to the <a href="#">Terms and Conditions</a> and <a href="#">Privacy Policy</a>
                    </label>
                </div>

                <!-- Sign Up Button -->
                <button type="submit" class="btn-signup">Sign Up</button>

                <!-- Bottom Login Link -->
                <p class="login-link">
                    Already have an account? <a href="./login.html">Log In</a>
                </p>

            </form>
        </div>
    </main>

</body>
</html>
