<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cebu Eastern College</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo-placeholder">
            <img src="../img/cecLOGO.png" alt="logo">
        </div>
        <div class="logo-text">
            <h1>CEBU EASTERN COLLEGE</h1>
            <p>Student Portal</p>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="login-wrapper">
        <div class="login-card">
            <h2>LOGIN</h2>
            <p class="subtitle">Sign in to access your account</p>

            <form action="" method="POST" id="loginForm">
                
                <!-- Email Field (Styled as "Active" to match image) -->
                <div class="form-group">
                    <label for="email">ID Number</label>
                    <div class="input-wrapper active">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="text" id="Idnumber" inputmode="numeric" maxlength="7" pattern="\d{7}" name="Idnumber" placeholder="Enter your ID number" required>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <!-- Forgot Password -->
                <a href="#" class="forgot-password">Forgot password?</a>

                <!-- Login Button -->
                <button type="submit" class="btn-login">Login</button>

                <!-- Divider -->
                <div class="divider">
                    <span>OR</span>
                </div>

                <!-- Create Account Button -->
                <a href="./register.html"><button type="button" class="btn-create">Create an Account</button></a>

            </form>
        </div>
    </main>
    <script src="../js/student_page/login.js"></script>

</body>
</html>
