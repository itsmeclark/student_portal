<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cebu Eastern College</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Reset & Variables */
        :root {
            --primary-blue: #253b80; /* Dark blue from header */
            --btn-blue: #2a3eb1;    /* Slightly brighter blue for button */
            --text-dark: #333;
            --text-light: #666;
            --border-color: #ccc;
            --input-bg: #e9ecef;    /* Light gray for password input */
            --error-red: #dc3545;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: var(--primary-blue);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
        }

        .logo-placeholder {
            width: 45px;
            height: 45px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary-blue);
            font-size: 22px;
        }

        .logo-text h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .logo-text p {
            font-size: 0.8rem;
            font-weight: 400;
            opacity: 0.9;
        }

        /* Main Background Area */
        .login-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            /* Simulating the faded building background */
            background: linear-gradient(rgba(230, 240, 255, 0.8), rgba(230, 240, 255, 0.8)), 
                        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect fill="%23d0dce8" width="100" height="100"/><path d="M0 50h100M50 0v100" stroke="%23c0cedc" stroke-width="1"/></svg>');
            background-size: cover;
            background-position: center;
        }

        /* Login Card */
        .login-card {
            background-color: white;
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .login-card h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 5px;
            color: #000;
        }

        .login-card p.subtitle {
            font-size: 0.9rem;
            color: var(--text-dark);
            margin-bottom: 30px;
        }

        /* Form Elements */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 0 15px;
            transition: all 0.3s ease;
        }

        /* Specific style for the active/focused email input shown in image */
        .input-wrapper.active {
            background-color: white;
            border-color: #4a6cf7;
            box-shadow: 0 0 0 1px #4a6cf7;
        }

        .input-wrapper i {
            color: #555;
            font-size: 1rem;
            margin-right: 10px;
        }

        .input-wrapper input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            padding: 14px 0;
            font-size: 0.9rem;
            color: var(--text-dark);
            font-family: inherit;
        }

        .input-wrapper input::placeholder {
            color: #888;
        }

        /* Forgot Password Link */
        .forgot-password {
            display: block;
            text-align: right;
            font-size: 0.8rem;
            color: var(--error-red);
            font-weight: 600;
            text-decoration: none;
            margin-top: -10px;
            margin-bottom: 25px;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* Buttons */
        .btn-login {
            width: 100%;
            background-color: var(--btn-blue);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 15px;
        }

        .btn-login:hover {
            background-color: #1e2e8a;
        }

        /* OR Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-dark);
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider span {
            padding: 0 10px;
        }

        .btn-create {
            width: 100%;
            background-color: transparent;
            color: var(--btn-blue);
            border: 1px solid var(--btn-blue);
            border-radius: 6px;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-create:hover {
            background-color: #f0f4ff;
        }

        /* Responsive Adjustments */
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }
            .login-card h2 {
                font-size: 1.8rem;
            }
            .logo-text h1 {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-placeholder">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div class="logo-text">
            <h1>CEBU EASTERN COLLEGE</h1>
            <p>Student Portal</p>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="login-wrapper">
        <div class="login-card">
            <h2>LOGIN</h2>
            <p class="subtitle">Sign in to access your account</p>

            <form action="#" method="POST">
                
                <!-- Email Field (Styled as "Active" to match image) -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper active">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <!-- Forgot Password -->
                <a href="#" class="forgot-password">Forgot password?</a>

                <!-- Login Button -->
                <button type="submit" class="btn-login">Login</button>

                <!-- Divider -->
                <div class="divider">
                    <span>OR</span>
                </div>

                <!-- Create Account Button -->
                <a href="./register.html"><button type="button" class="btn-create">Create an Account</button></a>

            </form>
        </div>
    </main>

</body>
</html>
