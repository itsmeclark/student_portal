<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Cebu Eastern College</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/password-toggle.css">
    <style>
        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e6f0ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ----- HEADER ----- */
        /* Same header as the student login page (public/css/login.css) */
        header {
            background-color: #253b80;
            color: #fff;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Clickable logo + title that returns to the homepage */
        .brand-link {
            display: flex;
            align-items: center;
            gap: 15px;
            color: inherit;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .brand-link:hover {
            opacity: 0.85;
        }

        /* "Back to Home" link on the right of the header */
        .back-home {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-size: 0.78rem;
            font-weight: 600;
            text-decoration: none;
            padding: 8px 14px;
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 7px;
            white-space: nowrap;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .back-home:hover {
            background: #fff;
            color: #253b80;
        }

        .back-home i {
            font-size: 0.8rem;
        }

        .logo-placeholder {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .logo-text h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .logo-text p {
            font-size: 0.8rem;
            font-weight: 400;
            opacity: 0.9;
        }

        /* ----- MAIN / LOGIN CARD ----- */
        /* Same card and form styling as the student login page (public/css/login.css) */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: linear-gradient(rgba(230, 240, 255, 0.8), rgba(230, 240, 255, 0.8)),
                        url('../img/biuildingCEC.png');
            background-position: left;
            background-repeat: no-repeat;
            background-size: contain;
        }

        .admin-login-card {
            background-color: white;
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .admin-login-card h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 5px;
            color: #000;
        }

        .admin-login-card p.subtitle {
            font-size: 0.9rem;
            color: #333;
            margin-bottom: 30px;
        }

        /* ----- FORM GROUPS ----- */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #333;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background-color: #ffffff;
            border: 1px solid gray;
            border-radius: 6px;
            padding: 0 15px;
            min-height: 48px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #1a4b9c;
            box-shadow: 0 0 0 3px rgba(26, 75, 156, 0.12);
        }

        .input-wrapper i {
            font-size: 1rem;
            color: #555;
            margin-right: 10px;
            width: auto;
            text-align: center;
            transition: color 0.2s;
        }

        .input-wrapper:focus-within i {
            color: #1a4b9c;
        }

        .input-wrapper input {
            border: none;
            outline: none;
            background: transparent;
            padding: 14px 0;
            font-size: 0.9rem;
            color: #333;
            width: 100%;
            font-weight: 400;
            font-family: inherit;
        }

        .input-wrapper input::placeholder {
            color: #888;
        }

        /* ----- LOGIN BUTTON ----- */
        .btn-admin-login {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #2a3eb1;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-admin-login:hover {
            background: #1e2e8a;
        }

        .btn-admin-login:active {
            background: #1a2880;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 480px) {
            .admin-login-card {
                padding: 30px 20px;
            }

            .admin-login-card h2 {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 380px) {
            .admin-login-card {
                padding: 28px 18px 26px;
            }
        }

        /* Header breakpoints - same as the student login page */
        @media (max-width: 480px) {
            .logo-text h1 {
                font-size: 1rem;
            }

            .back-home {
                padding: 7px 10px;
                font-size: 0.7rem;
                gap: 6px;
            }
        }

        @media (max-width: 380px) {
            .back-home {
                font-size: 0;
                gap: 0;
                padding: 9px 11px;
            }

            .back-home i {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <a class="brand-link" href="/" aria-label="Cebu Eastern College - back to homepage">
            <div class="logo-placeholder">
                <img src="../img/cecLOGO.png" alt="Cebu Eastern College Logo">
            </div>
            <div class="logo-text">
                <h1>CEBU EASTERN COLLEGE</h1>
                <p>Student Portal</p>
            </div>
        </a>

        <a class="back-home" href="/">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
    </header>

    <!-- Main Admin Login Card -->
    <main>
        <div class="admin-login-card">
            <h2>Admin</h2>
            <p class="subtitle">Sign in to access your account</p>

            <form action="" method="POST" id="adminLoginForm">
                <!-- Full Name Field -->
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="text" id="fullName" name="fullName" placeholder="Enter your name" required autocomplete="name">
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="adminPassword" name="password" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="password-toggle" data-password-toggle="adminPassword" aria-label="Show password" aria-pressed="false"><i class="fa-solid fa-eye"></i></button>
                    </div>
                </div>

                <!-- Log In Button -->
                <button type="submit" class="btn-admin-login">Log in</button>
            </form>
        </div>
    </main>
<script src="../js/admin.js"></script>
<script src="../js/password-toggle.js"></script>
</body>
</html>
