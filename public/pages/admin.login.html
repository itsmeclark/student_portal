<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Cebu Eastern College</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background-color: #d9dce6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* faint building background (matches the screenshot) */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" opacity="0.08"><rect width="1200" height="800" fill="%23a0b4d0"/><rect x="100" y="250" width="1000" height="550" fill="%238aa0c0"/><rect x="150" y="300" width="200" height="150" fill="%237a90b0"/><rect x="400" y="300" width="200" height="150" fill="%237a90b0"/><rect x="650" y="300" width="200" height="150" fill="%237a90b0"/><rect x="900" y="300" width="150" height="150" fill="%237a90b0"/><rect x="250" y="550" width="120" height="200" fill="%236a80a0"/><rect x="550" y="550" width="120" height="200" fill="%236a80a0"/><rect x="850" y="550" width="120" height="200" fill="%236a80a0"/><rect x="0" y="780" width="1200" height="20" fill="%235a7090"/></svg>');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* ----- HEADER ----- */
        header {
            background-color: #0b1e4b;
            padding: 14px 40px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .logo-placeholder {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid #ffffff;
        }

        .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-text h1 {
            font-size: 1.7rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            line-height: 1.15;
        }

        .logo-text p {
            font-size: 1rem;
            color: #cbd5e1;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* ----- MAIN / LOGIN CARD ----- */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .admin-login-card {
            background: #ffffff;
            border-radius: 28px;
            padding: 52px 48px 48px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.2);
            transition: box-shadow 0.2s;
        }

        .admin-login-card:hover {
            box-shadow: 0 25px 55px -12px rgba(0, 0, 0, 0.25);
        }

        .admin-login-card h2 {
            font-size: 2.8rem;
            font-weight: 700;
            color: #0b1e4b;
            text-align: center;
            margin-bottom: 36px;
            letter-spacing: -0.5px;
        }

        /* ----- FORM GROUPS ----- */
        .form-group {
            margin-bottom: 26px;
        }

        .form-group label {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            color: #0b1e4b;
            margin-bottom: 8px;
            letter-spacing: 0.2px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: #d9dce6;
            border-radius: 10px;
            padding: 0 22px;
            height: 58px;
            transition: background 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }

        .input-wrapper:focus-within {
            background: #ffffff;
            border-color: #1a4b9c;
            box-shadow: 0 0 0 4px rgba(26, 75, 156, 0.15);
        }

        .input-wrapper i {
            font-size: 1.2rem;
            color: #6b7c99;
            margin-right: 14px;
            width: 20px;
            text-align: center;
            transition: color 0.2s;
        }

        .input-wrapper:focus-within i {
            color: #1a4b9c;
        }

        .input-wrapper input {
            border: none;
            outline: none;
            background: transparent;
            font-size: 1.05rem;
            color: #0b1e4b;
            width: 100%;
            height: 100%;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .input-wrapper input::placeholder {
            color: #6b7c99;
            font-weight: 400;
            opacity: 0.9;
        }

        /* ----- LOGIN BUTTON ----- */
        .btn-admin-login {
            display: block;
            width: 100%;
            padding: 18px 24px;
            background: #2e3192;
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.25s, transform 0.15s, box-shadow 0.25s;
            margin-top: 14px;
            letter-spacing: 0.4px;
            box-shadow: 0 8px 18px -6px rgba(46, 49, 146, 0.4);
        }

        .btn-admin-login:hover {
            background: #1f2270;
            box-shadow: 0 12px 24px -8px rgba(46, 49, 146, 0.5);
            transform: translateY(-1px);
        }

        .btn-admin-login:active {
            transform: translateY(0);
            box-shadow: 0 6px 12px -4px rgba(46, 49, 146, 0.4);
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 560px) {
            header {
                padding: 12px 20px;
                gap: 12px;
            }

            .logo-placeholder {
                width: 44px;
                height: 44px;
            }

            .logo-text h1 {
                font-size: 1.2rem;
            }

            .logo-text p {
                font-size: 0.8rem;
            }

            .admin-login-card {
                padding: 36px 24px 34px;
                border-radius: 22px;
            }

            .admin-login-card h2 {
                font-size: 2.2rem;
                margin-bottom: 28px;
            }

            .input-wrapper {
                height: 52px;
                padding: 0 18px;
            }

            .input-wrapper input {
                font-size: 0.95rem;
            }

            .btn-admin-login {
                font-size: 1.1rem;
                padding: 15px 20px;
            }
        }

        @media (max-width: 380px) {
            .logo-text h1 {
                font-size: 1rem;
            }

            .logo-text p {
                font-size: 0.7rem;
            }

            .admin-login-card h2 {
                font-size: 1.9rem;
            }

            .admin-login-card {
                padding: 28px 18px 26px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo-placeholder">
            <img src="../img/cecLOGO.png" alt="Cebu Eastern College Logo">
        </div>
        <div class="logo-text">
            <h1>CEBU EASTERN COLLEGE</h1>
            <p>Student Portal</p>
        </div>
    </header>

    <!-- Main Admin Login Card -->
    <main>
        <div class="admin-login-card">
            <h2>Admin</h2>

            <form action="" method="POST" id="adminLoginForm">
                <!-- Full Name Field -->
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="text" id="fullName" name="fullName" placeholder="Enter your name" required autocomplete="name">
                    </div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="adminPassword" name="password" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                </div>

                <!-- Log In Button -->
                <button type="submit" class="btn-admin-login">Log in</button>
            </form>
        </div>
    </main>
<script src="../js/admin.js"></script>
</body>
</html>
