<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123eaa">
  <title>Tuition &amp; Assessment | Cebu Eastern College</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="side-heading">Main Menu</div>
      <nav class="side-nav" aria-label="Main navigation">
        <div id="sideNav"></div>
      </nav>
      <img class="dragon-mark" src="dragon.png" alt="" aria-hidden="true">
      <div class="sidebar-foot">CEC <span>STUDENT PORTAL</span></div>
    </aside>

    <main class="main-frame">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation" aria-expanded="true">☰</button>
        <div class="brand-lockup">
          <img class="seal" src="cec-logo.png" alt="Cebu Eastern College seal">
          <div class="brand-name">CEBU EASTERN<br>COLLEGE<small>STUDENT PORTAL</small></div>
        </div>
        <div class="topbar-spacer"></div>
        <div class="account-wrap">
          <button class="account-button" id="accountButton" aria-expanded="false">
            <span class="avatar">◉</span><span class="account-copy"><strong id="accountName">Gemar Enopia</strong><small id="accountRole">Administrator</small></span><span class="chevron">⌄</span>
          </button>
          <div class="account-menu" id="accountMenu">
            <button data-role="admin">Switch to Administrator</button>
            <button data-role="student">Switch to Student</button>
            <button id="logoutButton">Log out</button>
          </div>
        </div>
        <button class="logout-button" id="logoutTop"><span>⇥</span> Logout</button>
      </header>

      <section class="content-area" id="contentArea" aria-live="polite"></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
